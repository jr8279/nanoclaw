<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NanoClaw Todo</title>
  <meta name="theme-color" content="#21252B" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Todo" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="authScreen" class="auth-screen" hidden>
    <div class="auth-card">
      <h1>Todo</h1>
      <div id="authBody"></div>
      <p id="authError" class="form-error" hidden></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-heading">
        <h1>Todo</h1>
        <span class="today" id="todayLabel"></span>
      </div>
      <div class="topbar-actions">
        <button id="userMenuBtn" class="btn" aria-haspopup="true" aria-expanded="false"></button>
        <div id="userMenu" class="user-menu" hidden>
          <div class="user-menu-name" id="userMenuName"></div>
          <button id="addDeviceBtn" class="menu-item">Add a passkey on this device</button>
          <button id="inviteBtn" class="menu-item" hidden>Invite someone</button>
          <button id="signOutBtn" class="menu-item">Sign out</button>
        </div>
      </div>
    </header>

    <nav class="filters">
      <div class="tab-row" id="categoryChips"></div>
      <div class="status-row">
        <button class="status-tab" data-status="pending">Open</button>
        <button class="status-tab" data-status="completed">Done</button>
        <button class="status-tab" data-status="all">All</button>
      </div>
    </nav>

    <main id="taskList" class="task-list"></main>

    <button id="addBtn" class="fab" aria-label="Add task">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" /></svg>
    </button>
  </div>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <h2 id="dialogTitle">New task</h2>
      <input type="hidden" id="taskId" />

      <label>Title
        <input id="fTitle" required maxlength="200" />
      </label>

      <label>Notes
        <textarea id="fNotes" rows="3"></textarea>
      </label>

      <div class="row">
        <label>Category
          <select id="fCategory"></select>
        </label>
        <label>Importance
          <select id="fImportance">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>Due date
          <input id="fDue" type="datetime-local" />
        </label>
        <label>Repeats
          <select id="fFreq">
            <option value="">Never</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </label>
      </div>

      <label>Links (one per line, "label https://url")
        <textarea id="fLinks" rows="2" placeholder="School portal https://example.com"></textarea>
      </label>

      <label>Tag someone (puts it on their board too)
        <div id="fAssignees" class="assignee-picker"></div>
      </label>

      <p id="formError" class="form-error" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="button" id="deleteBtn" class="btn danger" hidden>Delete</button>
        <button type="submit" id="saveBtn" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="inviteDialog">
    <h2>Invite someone</h2>
    <p class="dialog-help">Share this link — it works once and expires in 3 days.</p>
    <div class="invite-link-row">
      <input id="inviteLinkOutput" readonly />
      <button id="inviteCopyBtn" class="btn" type="button">Copy</button>
    </div>
    <div class="dialog-actions">
      <button id="inviteCloseBtn" class="btn primary" type="button">Done</button>
    </div>
  </dialog>

  <script src="/webauthn.js"></script>
  <script src="/app.js"></script>
</body>
</html>
